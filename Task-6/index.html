<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form for Laundry Mart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <Div class="container">
        <div class="left">
            <img src="washing amchine.avif" alt="#">
        </div>
        <div class="right">
            <div class="form">
                <h1>Hello Again!</h1>
                <h2>Welcome back! We missed you!</h2>
                <form action="#">
                    <label for="Email">Email</label>
                    <input type="email" name="Email" id="Email" placeholder="Emailid@gmail.com"><br>
                    <label for="Password">Password</label>
                    <input type="password" name="password" id="" placeholder="Password">
                    <a href="http://google.com" class="forget">Forget password</a><br>
                    <Button>Login</Button>
                    <h4>Not a member? <a href="#" class="Register">Register Now</a></h4>
                </form>

            </div>
        </div>
    </Div>
</body>

</html>
